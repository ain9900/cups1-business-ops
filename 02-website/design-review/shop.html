const samples = {
  'C1-DW': ['double-wall.webp', 58, 500],
  'C1-SW': ['single-wall.webp', 39, 1000],
  'C1-RW': ['ripple-wall.webp', 62, 500],
  'C1-DS': ['dessert.webp', 44, 500],
  'C1-BOWL': ['bowls.webp', 74, 250],
  'C1-BOX-S': ['boxes.webp', 47, 200],
};
const money = new Intl.NumberFormat('en-US', {style:'currency',currency:'USD'});
const grid = document.querySelector('#products');
const nav = document.querySelector('nav');
const cart = document.querySelector('#cart');
const bag = document.querySelector('#bag');
const items = new Map();
let collection = 'Cups';

for (const category of ['All products', 'Cups', 'Lids', 'Containers', 'Ware', 'Custom Products']) {
  const button = document.createElement('button');
  button.textContent = category;
  button.addEventListener('click', () => { collection = category; render(); });
  nav.append(button);
}

function productCard(product) {
  const sample = samples[product.sku];
  const custom = product.category === 'Custom Products';
  const card = document.createElement('article');
  card.className = 'card';
  card.innerHTML = '<div class="media"><span>Image pending</span><button class="quick" type="button">Add to cart</button></div><div class="body"><h2></h2><label></label><select></select><div class="price" aria-live="polite"></div><div class="case"></div></div>';
  const media = card.querySelector('.media');
  const title = card.querySelector('h2');
  const select = card.querySelector('select');
  const label = card.querySelector('label');
  const price = card.querySelector('.price');
  const quantity = card.querySelector('.case');
  const quick = card.querySelector('.quick');
  title.textContent = product.name;
  select.id = product.sku;
  label.htmlFor = select.id;
  label.textContent = product.attribute;
  for (const option of product.options) select.add(new Option(option, option));
  if (product.defaultOption) select.value = product.defaultOption;
  select.hidden = label.hidden = !product.options.length;
  quick.hidden = !sample;
  quick.setAttribute('aria-label', 'Add ' + product.name + ' to demo cart');

  if (sample) {
    const image = new Image();
    image.src = 'assets/' + sample[0];
    image.alt = product.name + ' concept image';
    image.loading = 'lazy';
    media.prepend(image);
  }

  function update() {
    if (!sample) {
      price.textContent = custom ? 'Custom quote' : 'Price pending';
      return;
    }
    const index = Math.max(select.selectedIndex, 0);
    price.textContent = money.format(sample[1] + index * 8);
    quantity.textContent = (sample[2] / (index > 2 ? 2 : 1)).toLocaleString('en-US') + ' units per case';
  }

  select.addEventListener('change', update);
  quick.addEventListener('click', () => {
    const key = product.sku + ':' + select.value;
    const index = Math.max(select.selectedIndex, 0);
    const item = items.get(key) ?? {name: product.name, option: select.value, price: sample[1] + index * 8, count: 0};
    item.count++;
    items.set(key, item);
    cart.textContent = 'Demo cart (' + [...items.values()].reduce((sum, row) => sum + row.count, 0) + ')';
    document.querySelector('#status').textContent = product.name + ' added to demo cart.';
    renderCart();
    bag.showModal();
  });
  update();
  return card;
}

function renderCart() {
  const list = bag.querySelector('ul');
  list.replaceChildren();
  let total = 0;
  for (const item of items.values()) {
    const row = document.createElement('li');
    row.textContent = [item.name, item.option, item.count + ' × ' + money.format(item.price)].filter(Boolean).join(' · ');
    list.append(row);
    total += item.count * item.price;
  }
  bag.querySelector('#total').textContent = items.size ? 'Sample subtotal ' + money.format(total) : 'Your demo cart is empty.';
}

function render() {
  const visible = products.filter(product => collection === 'All products' || product.category === collection);
  for (const button of nav.children) button.setAttribute('aria-pressed', String(button.textContent === collection));
  document.querySelector('#count').textContent = visible.length + ' products';
  grid.replaceChildren(...visible.map(productCard));
}
cart.addEventListener('click', () => { renderCart(); bag.showModal(); });
